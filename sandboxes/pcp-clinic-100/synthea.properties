# Sandbox: 100-PCP adult primary care clinic (population-level route)
# Local config overrides for src/main/resources/synthea.properties.
# Used via: run_synthea -c sandboxes/pcp-clinic-100/synthea.properties (see README.md)

# Output lands under the git-ignored /output/ folder.
exporter.baseDirectory = ./output/pcp-clinic-100/

# Records span at most the last 10 years; per-patient years of service (1-10)
# are applied afterward by assign_panels.py.
exporter.years_of_history = 10

# Clinical data: FHIR R4 (US Core), one transaction bundle per patient.
exporter.fhir.export = true
exporter.fhir.use_us_core_ig = true
exporter.fhir.transaction_bundle = true
# Cost data is out of scope (Principal, 2026-11-26). Claim and ExplanationOfBenefit
# were about 46% of each pilot bundle, so they are not exported at all.
exporter.fhir.excluded_resources = Claim,ExplanationOfBenefit
exporter.fhir_stu3.export = false
exporter.fhir_dstu2.export = false
exporter.ccda.export = false
exporter.csv.export = false
exporter.cpcds.export = false
exporter.text.export = false
exporter.clinical_note.export = false

# A clinic panel is living patients.
generate.only_alive_patients = true
